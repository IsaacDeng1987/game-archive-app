<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="游戏档案">
    <meta name="theme-color" content="#050508">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>游戏档案</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #050508; --bg2: #0c0c14; --bg3: #14142a; --bg4: #1c1c38;
            --accent: #7c5cfc; --accent2: #a78bfa; --glow: rgba(124,92,252,0.2);
            --green: #10b981; --yellow: #f59e0b; --red: #ef4444; --blue: #3b82f6; --pink: #ec4899;
            --text: #f0f0f0; --text2: #7a7a9a; --border: #1a1a30;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; min-height: 100dvh; overflow-x: hidden; scrollbar-width: none; }
        body::-webkit-scrollbar { display: none; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }

        /* App Shell */
        .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
        .app-header { padding: calc(var(--safe-top) + 0.6rem) calc(var(--safe-right) + 1.2rem) 0.6rem calc(var(--safe-left) + 1.2rem); background: rgba(5,5,8,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
        .app-header-row { display: flex; align-items: center; justify-content: space-between; }
        .app-title { font-size: 1.3rem; font-weight: 700; }
        .app-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--safe-bottom) + 55px); }

        /* Tab Bar */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5,5,8,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; padding: 0.3rem 0 calc(var(--safe-bottom) + 0.15rem); z-index: 50; }
        .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.1rem; padding: 0.25rem 0; cursor: pointer; border: none; background: none; color: var(--text2); font-size: 0.6rem; transition: color 0.2s; }
        .tab-item.active { color: var(--accent2); }
        .tab-item .tab-icon { font-size: 1.1rem; }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; padding: 0.8rem 1rem 0.5rem; }
        .stat-card { background: linear-gradient(135deg, var(--bg2) 0%, var(--bg3) 100%); border: 1px solid var(--border); border-radius: 16px; padding: 0.9rem 1rem; position: relative; overflow: hidden; }
        .stat-card::after { content: ""; position: absolute; top: -20px; right: -20px; width: 60px; height: 60px; border-radius: 50%; opacity: 0.06; }
        .stat-card:nth-child(1)::after { background: var(--accent); }
        .stat-card:nth-child(2)::after { background: var(--blue); }
        .stat-card:nth-child(3)::after { background: #ffd700; }
        .stat-card:nth-child(4)::after { background: var(--green); }
        .stat-card .sc-icon { font-size: 1rem; margin-bottom: 0.3rem; }
        .stat-card .sc-label { font-size: 0.6rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .sc-value { font-size: 1.5rem; font-weight: 800; margin-top: 0.15rem; letter-spacing: -0.5px; }
        .stat-card .sc-sub { font-size: 0.6rem; color: var(--text2); margin-top: 0.1rem; }

        /* Section */
        .section-title { font-size: 0.9rem; font-weight: 600; padding: 1rem 1rem 0.6rem; display: flex; justify-content: space-between; align-items: center; }
        .section-title .count { font-size: 0.75rem; color: var(--text2); font-weight: 400; }

        /* Filter pills */
        .filter-scroll { padding: 0 1rem; overflow-x: auto; display: flex; gap: 0.4rem; scrollbar-width: none; }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-pill { padding: 0.35rem 0.8rem; background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; font-size: 0.75rem; color: var(--text2); cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all 0.2s; }
        .filter-pill.active { background: var(--accent); border-color: var(--accent); color: white; }

        /* Search */
        .search-wrap { padding: 0.6rem 1rem; }
        .search-box { width: 100%; padding: 0.6rem 1rem 0.6rem 2.2rem; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 0.85rem; outline: none; position: relative; }
        .search-box:focus { border-color: var(--accent); }
        .search-wrap { position: relative; }
        .search-wrap::before { content: "🔍"; position: absolute; left: 1.8rem; top: 50%; transform: translateY(-50%); font-size: 0.8rem; z-index: 1; }

        /* Game Cards - Mobile optimized */
        .game-list { padding: 0.5rem 1rem; display: flex; flex-direction: column; gap: 0.7rem; }
        .game-card { display: flex; gap: 0.8rem; padding: 0.8rem; background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; cursor: pointer; transition: all 0.15s; -webkit-user-select: none; user-select: none; }
        .game-card:active { transform: scale(0.98); background: var(--bg3); }
        .game-card img { width: 90px; height: 52px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--bg3); }
        .game-card-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
        .game-card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .game-card-meta { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
        .game-card-meta span { font-size: 0.7rem; color: var(--text2); }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
        .dot-playing { background: var(--blue); }
        .dot-completed { background: var(--green); }
        .dot-shelved { background: var(--yellow); }
        .dot-dropped { background: var(--red); }
        .dot-wishlist { background: var(--pink); }
        .game-card-rating { font-size: 0.75rem; color: #ffd700; margin-top: 0.3rem; }

        /* Floating Add Button */
        .fab { position: fixed; bottom: calc(var(--safe-bottom) + 60px); right: 1.2rem; width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #9b6dff); border: none; color: white; font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 20px var(--glow); z-index: 40; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
        .fab:active { transform: scale(0.9); }

        /* Modal - Full screen on mobile */
        .modal-overlay { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 100; overflow-y: auto; }
        .modal-overlay.active { display: block; }
        .modal-header { padding: calc(var(--safe-top) + 0.6rem) calc(var(--safe-right) + 1rem) 0.6rem calc(var(--safe-left) + 1rem); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 10; }
        .modal-header h2 { font-size: 1.1rem; }
        .modal-btn { background: none; border: none; color: var(--text2); font-size: 1rem; cursor: pointer; padding: 0.3rem 0.6rem; }
        .modal-btn.save { color: var(--accent2); font-weight: 600; }
        .modal-body { padding: 1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.7rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.4rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.7rem 0.8rem; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 0.9rem; outline: none; font-family: inherit; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
        .btn-delete { width: 100%; padding: 0.7rem; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; color: var(--red); font-size: 0.9rem; cursor: pointer; margin-top: 1rem; }

        /* Detail Page */
        .detail-page { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 90; overflow-y: auto; }
        .detail-page.active { display: block; }
        .detail-cover { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
        .detail-body { padding: 1.2rem; margin-top: -2rem; position: relative; }
        .detail-body::before { content: ""; position: absolute; top: -60px; left: 0; right: 0; height: 80px; background: linear-gradient(to top, var(--bg), transparent); pointer-events: none; }
        .detail-title { font-size: 1.5rem; font-weight: 700; position: relative; margin-bottom: 0.3rem; }
        .detail-status-row { display: flex; gap: 0.6rem; align-items: center; margin-bottom: 1rem; }
        .detail-stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.6rem; margin-bottom: 1.5rem; }
        .detail-stat { background: var(--bg2); border-radius: 10px; padding: 0.8rem; text-align: center; }
        .detail-stat .ds-val { font-size: 1.2rem; font-weight: 700; }
        .detail-stat .ds-lbl { font-size: 0.6rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 0.2rem; }
        .detail-section { margin-bottom: 1.5rem; }
        .detail-section h3 { font-size: 0.85rem; color: var(--text2); margin-bottom: 0.6rem; }
        .detail-section p { font-size: 0.9rem; line-height: 1.7; color: var(--text); white-space: pre-wrap; }
        .detail-back { position: fixed; top: calc(var(--safe-top) + 0.6rem); left: calc(var(--safe-left) + 0.8rem); width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: none; color: white; font-size: 1.2rem; cursor: pointer; z-index: 91; display: flex; align-items: center; justify-content: center; }
        .detail-edit { position: fixed; top: calc(var(--safe-top) + 0.6rem); right: calc(var(--safe-right) + 0.8rem); padding: 0.4rem 0.8rem; border-radius: 16px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: none; color: white; font-size: 0.8rem; cursor: pointer; z-index: 91; }

        /* Stats Page */
        .stats-page { padding: 0; }
        .chart-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; margin: 0.5rem 1rem; }
        .chart-card h3 { font-size: 0.8rem; color: var(--text2); margin-bottom: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .bar-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
        .bar-label { width: 55px; font-size: 0.7rem; color: var(--text2); text-align: right; flex-shrink: 0; }
        .bar-track { flex: 1; height: 22px; background: var(--bg3); border-radius: 6px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 6px; display: flex; align-items: center; padding-left: 0.5rem; font-size: 0.65rem; color: white; font-weight: 600; min-width: 20px; }

        /* Empty */
        .empty { text-align: center; padding: 4rem 2rem; color: var(--text2); }
        .empty .e-icon { font-size: 3rem; margin-bottom: 1rem; }

        .toast { position: fixed; top: calc(var(--safe-top) + 1rem); left: 50%; transform: translateX(-50%); background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 0.6rem 1.2rem; border-radius: 10px; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; z-index: 200; pointer-events: none; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
<div class="app">
    <div class="app-header">
        <div class="app-header-row">
            <div class="app-title" id="pageTitle">🎮 游戏档案</div>
        </div>
    </div>
    <div class="app-content" id="appContent"></div>
</div>

<button class="fab" id="fabBtn" onclick="openAdd()">＋</button>

<div class="tab-bar">
    <button class="tab-item active" data-tab="home" onclick="switchTab('home')"><span class="tab-icon">🎮</span>游戏库</button>
    <button class="tab-item" data-tab="stats" onclick="switchTab('stats')"><span class="tab-icon">📊</span>统计</button>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal-header">
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <h2 id="modalTitle">记录游戏</h2>
        <button class="modal-btn save" onclick="saveGame()">保存</button>
    </div>
    <div class="modal-body">
        <div class="form-group"><label>游戏名称</label><input id="fName" placeholder="输入游戏名称"></div>
        <div class="form-row">
            <div class="form-group"><label>状态</label><select id="fStatus"><option value="playing">🎮 在玩</option><option value="completed">✅ 已通关</option><option value="shelved">⏸️ 搁置</option><option value="dropped">❌ 弃坑</option><option value="wishlist">💜 想玩</option></select></div>
            <div class="form-group"><label>评分 (1-10)</label><input type="number" id="fRating" min="1" max="10" placeholder="8"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>游玩时长(h)</label><input type="number" id="fHours" min="0" placeholder="20"></div>
            <div class="form-group"><label>平台</label><select id="fPlatform"><option>PC</option><option>PS5</option><option>PS4</option><option>Switch</option><option>Xbox</option><option>手机</option><option>Steam Deck</option></select></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>类型</label><input id="fGenre" placeholder="动作RPG"></div>
            <div class="form-group"><label>通关度</label><select id="fCompletion"><option>未通关</option><option>主线</option><option>全支线</option><option>白金</option></select></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>难度</label><select id="fDifficulty"><option value="">未评价</option><option>简单</option><option>适中</option><option>困难</option><option>劝退</option></select></div>
            <div class="form-group"><label>开始日期</label><input type="date" id="fStart"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>完成日期</label><input type="date" id="fEnd"></div>
            <div class="form-group"><label>封面URL</label><input id="fCover" placeholder="留空自动搜索"></div>
        </div>
        <div class="form-group"><label>短评</label><input id="fShort" placeholder="一句话评价"></div>
        <div class="form-group"><label>笔记</label><textarea id="fNotes" placeholder="游玩感想..."></textarea></div>
        <button class="btn-delete" id="btnDel" style="display:none" onclick="deleteGame()">🗑️ 删除这条记录</button>
    </div>
</div>

<!-- Detail -->
<div class="detail-page" id="detailPage">
    <button class="detail-back" onclick="closeDetail()">‹</button>
    <button class="detail-edit" id="detailEditBtn">编辑</button>
    <div id="detailContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const RAWG_KEY='b54be8ce2eda4e5a8b6e44c17393c41d', SK='game_archive_app';
const statusMap={playing:'在玩',completed:'已通关',shelved:'搁置',dropped:'弃坑',wishlist:'想玩'};
const statusDot={playing:'dot-playing',completed:'dot-completed',shelved:'dot-shelved',dropped:'dot-dropped',wishlist:'dot-wishlist'};
const statusColors={playing:'var(--blue)',completed:'var(--green)',shelved:'var(--yellow)',dropped:'var(--red)',wishlist:'var(--pink)'};

const defaultData=[
    {name:"艾尔登法环",cover:"https://cdn.cloudflare.steamstatic.com/steam/apps/1245620/header.jpg",status:"completed",rating:10,hours:150,platform:"PC",genre:"动作RPG",completion:"全支线",difficulty:"困难",startDate:"2024-03-01",endDate:"2024-05-15",shortReview:"近十年最佳开放世界",notes:"探索感极强，DLC黄金树幽影同样精彩。",addedAt:"2024-05-15T00:00:00Z"},

    {name:"死亡搁浅",cover:"https://cdn.cloudflare.steamstatic.com/steam/apps/1190460/header.jpg",status:"dropped",rating:6,hours:15,platform:"PC",genre:"动作",completion:"未通关",difficulty:"适中",startDate:"2024-04-01",endDate:"",shortReview:"走路模拟器不适合我",notes:"概念有意思但太枯燥。",addedAt:"2024-04-15T00:00:00Z"},
    {name:"P5 皇家版",cover:"https://cdn.cloudflare.steamstatic.com/steam/apps/1687950/header.jpg",status:"wishlist",rating:null,hours:0,platform:"PC",genre:"JRPG",completion:"未通关",difficulty:"",startDate:"",endDate:"",shortReview:"",notes:"等有空了开坑。",addedAt:"2025-01-01T00:00:00Z"},
];

let records=JSON.parse(localStorage.getItem(SK)||'null')||defaultData;
let editIdx=-1, activeFilter=null, currentTab='home';

function save(){localStorage.setItem(SK,JSON.stringify(records))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

function switchTab(tab){
    currentTab=tab;
    document.querySelectorAll('.tab-item').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
    document.getElementById('fabBtn').style.display=tab==='home'?'flex':'none';
    document.getElementById('pageTitle').textContent=tab==='home'?'🎮 游戏档案':'📊 统计';
    render();
}

function render(){
    const c=document.getElementById('appContent');
    if(currentTab==='home') renderHome(c);
    else renderStatsPage(c);
}

function renderHome(c){
    const total=records.length, totalH=records.reduce((s,r)=>s+(r.hours||0),0);
    const rated=records.filter(r=>r.rating), avg=rated.length?(rated.reduce((s,r)=>s+r.rating,0)/rated.length).toFixed(1):'-';
    const comp=records.filter(r=>r.status==='completed').length;

    const q=(document.getElementById('searchQ')?.value||'').toLowerCase();
    let filtered=records.filter(r=>{
        if(activeFilter&&r.status!==activeFilter)return false;
        if(q&&!r.name.toLowerCase().includes(q))return false;
        return true;
    });

    c.innerHTML=`
        <div class="stats-grid">
            <div class="stat-card"><div class="sc-icon">🎮</div><div class="sc-label">总游戏</div><div class="sc-value">${total}</div></div>
            <div class="stat-card"><div class="sc-icon">⏱️</div><div class="sc-label">总时长</div><div class="sc-value">${totalH}<span style="font-size:0.75rem;color:var(--text2);font-weight:400"> h</span></div></div>
            <div class="stat-card"><div class="sc-icon">⭐</div><div class="sc-label">平均评分</div><div class="sc-value" style="color:#ffd700">${avg}</div></div>
            <div class="stat-card"><div class="sc-icon">🏆</div><div class="sc-label">已通关</div><div class="sc-value" style="color:var(--green)">${comp}</div><div class="sc-sub">通关率 ${total?Math.round(comp/total*100):0}%</div></div>
        </div>
        <div class="search-wrap"><input class="search-box" id="searchQ" placeholder="搜索游戏..." oninput="render()" value="${q}"></div>
        <div class="filter-scroll" style="margin-bottom:0.5rem">
            <div class="filter-pill ${!activeFilter?'active':''}" onclick="activeFilter=null;render()">全部</div>
            ${Object.entries(statusMap).map(([k,v])=>`<div class="filter-pill ${activeFilter===k?'active':''}" onclick="activeFilter='${k}';render()">${v}</div>`).join('')}
        </div>
        <div class="game-list">${filtered.length?filtered.map(r=>{
            const i=records.indexOf(r);
            return `<div class="game-card" onclick="showDetail(${i})">
                <img src="${r.cover}" onerror="this.style.background='var(--bg3)'">
                <div class="game-card-info">
                    <div class="game-card-title">${r.name}</div>
                    <div class="game-card-meta">
                        <span class="status-dot ${statusDot[r.status]}"></span>
                        <span>${statusMap[r.status]}</span>
                        ${r.hours?`<span>${r.hours}h</span>`:''}
                        ${r.platform?`<span>${r.platform}</span>`:''}
                    </div>
                    ${r.rating?`<div class="game-card-rating">${'★'.repeat(Math.round(r.rating/2))}${'☆'.repeat(5-Math.round(r.rating/2))} ${r.rating}/10</div>`:''}
                </div>
            </div>`;
        }).join(''):`<div class="empty"><div class="e-icon">🎮</div>没有找到游戏</div>`}</div>
    `;
}

function renderStatsPage(c){
    const total=records.length, totalH=records.reduce((s,r)=>s+(r.hours||0),0);
    const top=[...records].sort((a,b)=>(b.hours||0)-(a.hours||0))[0];
    c.innerHTML=`
        <div class="stats-grid">
            <div class="stat-card"><div class="sc-icon">🎮</div><div class="sc-label">总游戏</div><div class="sc-value">${total}</div></div>
            <div class="stat-card"><div class="sc-icon">⏱️</div><div class="sc-label">总时长</div><div class="sc-value">${totalH}h</div><div class="sc-sub">≈${Math.round(totalH/24)}天</div></div>
            <div class="stat-card"><div class="sc-icon">🔥</div><div class="sc-label">最肝</div><div class="sc-value" style="font-size:0.85rem">${top?top.name:'-'}</div><div class="sc-sub">${top?.hours||0}h</div></div>
            <div class="stat-card"><div class="sc-icon">🏆</div><div class="sc-label">通关率</div><div class="sc-value" style="color:var(--green)">${total?Math.round(records.filter(r=>r.status==='completed').length/total*100):0}%</div></div>
        </div>
        ${chartCard('类型分布',countField('genre'),'var(--accent)')}
        ${chartCard('平台分布',countField('platform'),'var(--blue)')}
        ${chartCard('状态分布',Object.fromEntries(Object.entries(countField('status')).map(([k,v])=>[statusMap[k]||k,v])),'var(--green)')}
    `;
}
function countField(f){const c={};records.forEach(r=>{const v=r[f];if(v)c[v]=(c[v]||0)+1});return c}
function chartCard(title,data,color){
    const entries=Object.entries(data).sort((a,b)=>b[1]-a[1]);
    const max=Math.max(...entries.map(e=>e[1]),1);
    return `<div class="chart-card"><h3>${title}</h3>${entries.slice(0,6).map(([l,n])=>`<div class="bar-row"><div class="bar-label">${l}</div><div class="bar-track"><div class="bar-fill" style="width:${n/max*100}%;background:${color}">${n}</div></div></div>`).join('')}</div>`;
}

// Detail
function showDetail(i){
    const r=records[i];
    const dp=document.getElementById('detailPage');
    dp.classList.add('active');
    document.getElementById('detailEditBtn').onclick=()=>{closeDetail();openEdit(i)};
    document.getElementById('detailContent').innerHTML=`
        <img class="detail-cover" src="${r.cover}" onerror="this.style.background='var(--bg3)';this.style.height='180px'">
        <div class="detail-body">
            <div class="detail-title">${r.name}</div>
            <div class="detail-status-row">
                <span class="status-dot ${statusDot[r.status]}"></span>
                <span style="font-size:0.85rem;color:var(--text2)">${statusMap[r.status]}</span>
                ${r.shortReview?`<span style="font-size:0.8rem;color:var(--text2);font-style:italic">— "${r.shortReview}"</span>`:''}
            </div>
            <div class="detail-stat-grid">
                ${r.rating?`<div class="detail-stat"><div class="ds-val" style="color:#ffd700">★ ${r.rating}</div><div class="ds-lbl">评分</div></div>`:''}
                ${r.hours?`<div class="detail-stat"><div class="ds-val">${r.hours}h</div><div class="ds-lbl">时长</div></div>`:''}
                ${r.platform?`<div class="detail-stat"><div class="ds-val">${r.platform}</div><div class="ds-lbl">平台</div></div>`:''}
                ${r.genre?`<div class="detail-stat"><div class="ds-val">${r.genre}</div><div class="ds-lbl">类型</div></div>`:''}
                ${r.completion&&r.completion!=='未通关'?`<div class="detail-stat"><div class="ds-val">${r.completion}</div><div class="ds-lbl">通关度</div></div>`:''}
                ${r.difficulty?`<div class="detail-stat"><div class="ds-val">${r.difficulty}</div><div class="ds-lbl">难度</div></div>`:''}
            </div>
            ${r.startDate||r.endDate?`<div class="detail-section"><h3>📅 时间</h3><p>${r.startDate||'?'} → ${r.endDate||'进行中'}</p></div>`:''}
            ${r.notes?`<div class="detail-section"><h3>📝 笔记</h3><p>${r.notes}</p></div>`:''}
        </div>
    `;
}
function closeDetail(){document.getElementById('detailPage').classList.remove('active')}

// Modal
function openAdd(){editIdx=-1;document.getElementById('modalTitle').textContent='记录游戏';document.getElementById('btnDel').style.display='none';clearForm();document.getElementById('modal').classList.add('active')}
function openEdit(i){editIdx=i;const r=records[i];document.getElementById('modalTitle').textContent='编辑';document.getElementById('btnDel').style.display='block';document.getElementById('fName').value=r.name||'';document.getElementById('fStatus').value=r.status;document.getElementById('fRating').value=r.rating||'';document.getElementById('fHours').value=r.hours||'';document.getElementById('fPlatform').value=r.platform||'PC';document.getElementById('fGenre').value=r.genre||'';document.getElementById('fCompletion').value=r.completion||'未通关';document.getElementById('fDifficulty').value=r.difficulty||'';document.getElementById('fStart').value=r.startDate||'';document.getElementById('fEnd').value=r.endDate||'';document.getElementById('fShort').value=r.shortReview||'';document.getElementById('fNotes').value=r.notes||'';document.getElementById('fCover').value=r.cover||'';document.getElementById('modal').classList.add('active')}
function closeModal(){document.getElementById('modal').classList.remove('active')}
function clearForm(){['fName','fRating','fHours','fGenre','fStart','fEnd','fShort','fNotes','fCover'].forEach(id=>document.getElementById(id).value='');document.getElementById('fStatus').value='playing';document.getElementById('fPlatform').value='PC';document.getElementById('fCompletion').value='未通关';document.getElementById('fDifficulty').value=''}

async function saveGame(){
    const name=document.getElementById('fName').value.trim();
    if(!name){toast('请输入游戏名称');return}
    let cover=document.getElementById('fCover').value.trim();
    if(!cover){try{const r=await fetch(`https://api.rawg.io/api/games?key=${RAWG_KEY}&search=${encodeURIComponent(name)}&page_size=1`);if(r.ok){const d=await r.json();if(d.results?.[0]?.background_image)cover=d.results[0].background_image}}catch(e){}}
    const rec={name,cover,status:document.getElementById('fStatus').value,rating:parseInt(document.getElementById('fRating').value)||null,hours:parseInt(document.getElementById('fHours').value)||null,platform:document.getElementById('fPlatform').value,genre:document.getElementById('fGenre').value.trim(),completion:document.getElementById('fCompletion').value,difficulty:document.getElementById('fDifficulty').value,startDate:document.getElementById('fStart').value,endDate:document.getElementById('fEnd').value,shortReview:document.getElementById('fShort').value.trim(),notes:document.getElementById('fNotes').value.trim(),addedAt:editIdx>=0?records[editIdx].addedAt:new Date().toISOString()};
    if(editIdx>=0)records[editIdx]=rec;else records.unshift(rec);
    save();closeModal();render();toast(editIdx>=0?'✅ 已更新':'✅ 已记录');
}
function deleteGame(){if(!confirm('确定删除？'))return;records.splice(editIdx,1);save();closeModal();render();toast('🗑️ 已删除')}

// Register SW
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
